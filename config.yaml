model:
  default: gpt-5.6-luna
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
browser:
  backend: browser-use
display:
  skin: matrix
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: byterover
  byterover:
    auto_extract: 'true'
moa:
  presets:
    default:
      reference_models:
        - provider: custom:agents.gin1111.dev
          model: kr/claude-opus-4.8-thinking
        - provider: custom:agents.gin1111.dev
          model: kr/gpt-5.6-terra
        - provider: custom:agents.gin1111.dev
          model: nvidia/deepseek-ai/deepseek-v4-pro
      aggregator:
        provider: custom:agents.gin1111.dev
        model: cx/gpt-5.6-sol
      fanout: per_iteration
  reference_models:
    - provider: custom:agents.gin1111.dev
      model: kr/claude-opus-4.8-thinking
    - provider: custom:agents.gin1111.dev
      model: kr/gpt-5.6-terra
    - provider: custom:agents.gin1111.dev
      model: nvidia/deepseek-ai/deepseek-v4-pro
  aggregator:
    provider: custom:agents.gin1111.dev
    model: cx/gpt-5.6-sol
  max_tokens: 4096
  fanout: per_iteration
  enabled: true
skills:
  external_dirs:
    - ${HOME}/.agents/skills
    - ${HOME}/dev/gin-harness/skills
    - /Users/gin/dev/gin-harness/skills
  write_approval: true
  disabled:
    - aioz-map-layer
    - aioz-wallet-mobile-ui-v2-widget-porting
    - browser-extension-react-fast-refresh
    - canvas-map-overlay
    - data-driven-file-generation
    - delivery-verification-in-monorepos
    - design-md-theme-implementation
    - form-state-sync-and-restoration
    - html-diagram
    - keplr-wallet-hooks
    - local-storage-session-management
    - map-gl-overlay-integration
    - map-layer-migration
    - map-layer-query-filters
    - map-layer-temporal-filters
    - map-overlay-unification
    - monorepo-targeted-test-verification
    - network-graph-visualization
    - token-amount-formatting
    - token-and-network-picker-ordering
    - ui-v2-component-integration
onboarding:
  seen:
    tool_progress_prompt: true
_config_version: 38
custom_providers:
  - api_key: ${GIN_API_KEY}
    base_url: ${GIN_BASE_URL}
    default: coder
    name: agents.gin1111.dev
    model: coding
platform_toolsets:
  cli:
    - a2a
    - bfl
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - mcp-codegraph
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
known_plugin_toolsets:
  cli:
    - a2a
    - spotify
plugins:
  enabled:
    - english-tutor
    - ginflow-gate
  disabled: []
mcp_servers:
  chrome-devtools:
    command: npx
    args:
      - chrome-devtools-mcp@latest
      - --autoConnect
      - --channel=beta
  gemini-notebook-lm:
    command: uvx
    args:
      - --from
      - notebooklm-mcp-cli
      - notebooklm-mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  codegraph:
    command: codegraph
    args:
      - serve
      - --mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  drawio:
    command: npx
    args:
      - '@drawio/mcp'
    timeout: 120
    connect_timeout: 60
    enabled: true
  mnemosyne:
    command: mnemosyne
    args:
      - mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  open-design:
    command: /Users/gin/Library/Application Support/Open Design/launcher/channels/stable/namespaces/release-stable/versions/0.20.2/payload/Open
      Design.app/Contents/Frameworks/Open Design Helper.app/Contents/MacOS/Open Design
      Helper
    args:
      - /Users/gin/Library/Application Support/Open Design/launcher/channels/stable/namespaces/release-stable/versions/0.20.2/payload/Open
        Design.app/Contents/Resources/app/prebundled/daemon/daemon-cli.mjs
      - mcp
    env:
      OD_DATA_DIR: /Users/gin/Library/Application Support/Open Design/namespaces/release-stable/data
      OD_SIDECAR_IPC_PATH: /tmp/open-design/ipc/release-stable/daemon.sock
      OD_MCP_BOOTSTRAP_COMMAND: /usr/bin/open
      OD_MCP_BOOTSTRAP_ARGS: '["-g","-j","/Applications/Open Design.app","--args","--headless"]'
      ELECTRON_RUN_AS_NODE: '1'
    connect_timeout: 60.0
    enabled: true
known_builtin_toolsets:
  cli:
    - bfl
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
agent: {}

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
