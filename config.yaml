model:
  default: coder
  provider: custom
  base_url: https://agents.gin1111.dev/v1
  api_key: ${GIN_API_KEY}
display:
  skin: mono
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: byterover
  byterover:
    auto_extract: false
moa:
  presets:
    default:
      reference_models:
        - provider: custom:agents.gin1111.dev
          model: kr/claude-opus-4.8-thinking
        - provider: custom:agents.gin1111.dev
          model: kr/gpt-5.6-terra
        - provider: custom:agents.gin1111.dev
          model: nvidia/deepseek-ai/deepseek-v4-pro
      aggregator:
        provider: custom:agents.gin1111.dev
        model: cx/gpt-5.6-sol
      fanout: per_iteration
  reference_models:
    - provider: custom:agents.gin1111.dev
      model: kr/claude-opus-4.8-thinking
    - provider: custom:agents.gin1111.dev
      model: kr/gpt-5.6-terra
    - provider: custom:agents.gin1111.dev
      model: nvidia/deepseek-ai/deepseek-v4-pro
  aggregator:
    provider: custom:agents.gin1111.dev
    model: cx/gpt-5.6-sol
  max_tokens: 4096
  fanout: per_iteration
  enabled: true
skills:
  external_dirs:
    - ${HOME}/.agents/skills
    - /home/aioz/personal/gin-harness/skills
  write_approval: true
  disabled:
    - aioz-map-layer
    - aioz-wallet-mobile-ui-v2-widget-porting
    - browser-extension-react-fast-refresh
    - canvas-map-overlay
    - data-driven-file-generation
    - delivery-verification-in-monorepos
    - design-md-theme-implementation
    - form-state-sync-and-restoration
    - html-diagram
    - keplr-wallet-hooks
    - local-storage-session-management
    - map-gl-overlay-integration
    - map-layer-migration
    - map-layer-query-filters
    - map-layer-temporal-filters
    - map-overlay-unification
    - monorepo-targeted-test-verification
    - network-graph-visualization
    - token-amount-formatting
    - token-and-network-picker-ordering
    - ui-v2-component-integration
_config_version: 33
custom_providers:
  - api_key: ${GIN_API_KEY}
    base_url: ${GIN_BASE_URL}
    default: coder
    name: agents.gin1111.dev
platform_toolsets:
  cli:
    - code_execution
    - delegation
    - file
    - kanban
    - mcp-codegraph
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
known_plugin_toolsets:
  cli:
    - spotify
plugins:
  enabled: []
  disabled:
    - ginflow-gate
mcp_servers:
  gemini-notebook-lm:
    command: uvx
    args:
      - --from
      - notebooklm-mcp-cli
      - notebooklm-mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  codegraph:
    command: codegraph
    args:
      - serve
      - --mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  drawio:
    command: npx
    args:
      - "@drawio/mcp"
    timeout: 120
    connect_timeout: 60
    enabled: true
